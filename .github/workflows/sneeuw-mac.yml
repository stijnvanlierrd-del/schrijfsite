name: Sneeuw macOS-app

on:
  push:
    paths:
      - "sneeuw-mac/**"
      - ".github/workflows/sneeuw-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: App en DMG bouwen
        run: |
          chmod +x sneeuw-mac/build.sh
          ./sneeuw-mac/build.sh

      - name: DMG bewaren als artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sneeuw-dmg
          path: sneeuw-mac/build/Sneeuw.dmg

      - name: Release publiceren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sneeuw-v1.0.${{ github.run_number }}
          name: Sneeuw 1.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Sneeuw voor je Mac. Download **Sneeuw.dmg**, open hem en sleep Sneeuw naar Programma's.
            De eerste keer: rechtermuisknop op de app → Open (de app is niet bij Apple geregistreerd).
          files: sneeuw-mac/build/Sneeuw.dmg
